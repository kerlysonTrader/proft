# config.yaml — configuração em uso (gerada a partir de ../config.example.yaml).
# NUNCA coloque chaves/segredos aqui: eles vêm do Google Secret Manager
# (ou de variáveis de ambiente no desenvolvimento local).

mode: paper            # paper (simulado interno) | demo (Bybit Demo Trading) | live (conta real)
timezone: America/Sao_Paulo

bybit:
  category: spot                  # só spot: o código recusa qualquer outra categoria (derivativos ficam para uma fase futura)
  quote: USDT
  rest_url:
    live: https://api.bybit.com
    demo: https://api-demo.bybit.com
  ws_public_url: wss://stream.bybit.com/v5/public/spot
  recv_window_ms: 5000
  max_requests_per_second: 8      # limite próprio, abaixo do limite da Bybit
  http_timeout_seconds: 10
  max_retries: 4                  # novas tentativas em erros temporários (rede, 5xx, limite de requisições)
  backoff_base_seconds: 0.5       # espera = base * 2^tentativa (com variação aleatória), até o máximo abaixo
  backoff_max_seconds: 8
  time_sync_minutes: 30           # ressincroniza o relógio com /v5/market/time

logging:
  level: INFO                     # DEBUG | INFO | WARNING | ERROR

market_data:
  db_path: data/market.db         # velas FECHADAS persistidas (SQLite); caminho relativo à pasta bybit_bot
  kline_page_limit: 1000          # máximo por chamada da Bybit
  kline_close_grace_seconds: 5    # espera após o fechamento da vela antes de buscá-la
  orderbook_depth: 200            # níveis do livro (spot aceita até 200)
  derivatives_period: 1h          # intervalo do open interest e da razão long/short
  oi_change_hours: 24             # janela da variação do open interest
  cache_ttl_seconds:
    tickers: 30
    orderbook: 10
    derivatives: 300
    instruments: 3600
  history:                        # download para o backtest (python -m bot.backtest.data_loader)
    db_path: data/history.db
    months: 13                    # 12 meses + 1 de aquecimento dos indicadores
    top_n: 50                     # moedas de maior volume 24h (mais o BTC)
    intervals: ["60", "240", "D"] # 1H, 4H, 1D

indicators:                       # períodos usados pelo score e pelos setups
  ema_short: 20
  ema_mid: 50
  ema_long: 200
  rsi_period: 14
  atr_period: 14
  atr_avg_period: 50              # média do próprio ATR (contração de volatilidade)
  adx_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bollinger_period: 20
  bollinger_std: 2.0
  bb_width_lookback: 120          # janela do percentil da largura das Bandas
  cmf_period: 20
  obv_ema_period: 20
  volume_avg_period: 20

schedule:
  universe_and_score_minutes: 60  # scanner completo
  entry_triggers_minutes: 15      # checagem de gatilhos na Watchlist A
  position_management_minutes: 5  # trailing, stop de tempo, reconciliação
  heartbeat_seconds: 60

universe:
  min_turnover_24h_usdt: 5000000
  max_spread_pct: 0.15
  min_bid_depth_2pct_usdt: 50000
  depth_window_pct: 2             # profundidade = ordens de compra até −2 % do preço médio (só finalistas)
  min_daily_candles: 120
  max_change_24h_pct: 25
  min_change_24h_pct: -15
  exclude_bases: [                # stablecoins, ouro/ativos atrelados e wrapped (quase não oscilam)
    USDC, FDUSD, DAI, TUSD, USDE, PYUSD, EURC, RLUSD, USD1, USDS, USDD, USDP, BUSD, FRAX, GHO, LUSD,
    SUSDE, USDT0, USDTB, USDR, EURI, XAUT, PAXG, WBTC, WETH, STETH, WSTETH, CBBTC]
  exclude_suffixes: ["2L", "3L", "5L", "2S", "3S", "5S"]
  blacklist: []

regime:
  btc_symbol: BTCUSDT
  daily_ema: 200
  h4_fast_ema: 50
  h4_slow_ema: 200
  min_breadth_pct: 30
  circuit_breaker_btc_drop_24h_pct: 5
  circuit_breaker_pause_hours: 12

score:
  watchlist_a_min: 70
  watchlist_b_min: 60
  neutral_regime_extra_min: 5
  weights:            # máximos por componente (soma = 100)
    trend: 25
    relative_strength: 20
    volume: 20
    squeeze: 15
    derivatives: 10
    momentum: 10
  volume_ratio_band: [1.3, 4.0]
  pump_volume_ratio: 6.0
  bb_width_percentile_max: 25
  rsi_band_4h: [50, 68]
  rsi_overbought_4h: 75
  max_dist_from_ema20_4h_pct: 12
  funding_ok_range_pct: [-0.01, 0.03]
  funding_hot_pct: 0.05
  max_long_short_ratio: 1.5
  derivatives_neutral_points: 5
  # pontos de cada condição (a soma por componente deve igualar weights) — seção 3 do 03_ESTRATEGIA.md
  points:
    trend: {price_above_ema50_4h: 7, ema50_above_ema200_4h: 7, price_above_ema50_1d: 5, adx_trend_4h: 6}
    relative_strength: {ret_short_vs_btc: 6, ret_long_vs_btc: 6, ratio_above_ema_1d: 8}
    volume: {volume_ratio_in_band: 8, obv_rising_4h: 6, cmf_positive_4h: 6}
    squeeze: {bb_width_low_4h: 8, upper_third_range_4h: 4, atr_contracting_4h: 3}
    derivatives: {oi_rising_price_flat: 4, funding_ok: 3, long_short_ok: 3}
    momentum: {rsi_in_band_4h: 5, macd_hist_rising_4h: 5}
  penalties: {rsi_overbought_4h: -10, stretched_from_ema20_4h: -10, pump_volume: -8, funding_hot: -5,
              upper_wick_rejection_1d: -5}
  adx_min: 20
  rs_short_days: 7
  rs_long_days: 30
  ratio_ema_period: 20            # EMA da razão MOEDA/BTC (diário)
  obv_slope_bars: 3               # OBV "inclinando para cima" = OBV atual > OBV de 3 velas 4H atrás
  cmf_min: 0.05
  range_lookback_4h: 20
  upper_range_fraction: 0.6667    # terço superior do range
  oi_rise_min_pct: 5
  oi_price_rise_max_pct: 8
  upper_wick_max_fraction: 0.6
  wick_lookback_days: 3
  candles:                        # velas FECHADAS buscadas por moeda em cada varredura
    d1: 200
    h4: 500
    h1: 200
  workers: 6                      # chamadas em paralelo (o limitador de taxa do cliente continua valendo)

setups:
  enabled: [pullback_tendencia, rompimento_compressao, ote_fibo]
  pullback_tendencia:
    min_trend_points: 18
    rsi_touch_band_1h: [35, 45]
    order_valid_candles_1h: 2
    stop_atr_buffer: 0.5
    pullback_lookback_1h: 12        # velas 1H em que o recuo (zona das EMAs e RSI) é procurado
    entry_tolerance_pct: 0.1        # limite = fechamento da confirmação + 0,1 %
    min_body_fraction: 0.5          # corpo da vela de confirmação ≥ 50 % do range
  rompimento_compressao:
    min_squeeze_points: 10
    range_lookback_4h: 20
    breakout_volume_ratio: 1.8
    retest_offset_pct: 0.2
    order_valid_candles_1h: 6
    stop_atr_mult: 1.5
    min_stop_atr: 1.0               # distância mínima do stop = 1 × ATR 1H
  ote_fibo:                         # porte do MQL5/Experts/ICT_FiboEntry_EA.mq5 (só compras)
    swing_bars: 5
    min_leg_atr: 3.0
    ote_start: 0.618
    ote_end: 0.79
    displacement_atr: 1.5
    use_order_block: true           # exige confluência OTE ∩ Order Block
    ob_lookback: 40                 # velas antes do fim da perna onde a vela de deslocamento é procurada
    stop_atr_buffer: 0.25           # stop = mín(OB, origem da perna) − 0,25 × ATR 1H
    tp1_level: 0.5                  # 50 % da perna
    tp2_level: 0.0                  # topo da perna
    tp3_extension: 1.618            # extensão (informativa; o TP2 é o alvo do filtro de R:R)
    entry_tolerance_pct: 0.1
    order_valid_candles_1h: 2
  common:
    min_rr_tp2: 2.0
    min_stop_pct: 1.5
    max_stop_pct: 8.0
    reentry_cooldown_hours: 24

gemini:
  enabled: true
  provider: vertex          # vertex (recomendado na VM, sem chave) | ai_studio (GEMINI_API_KEY)
  model_screening: "<modelo Gemini Flash mais recente>"
  model_final: "<modelo Gemini Pro mais recente>"
  use_google_search_grounding: true
  timeout_seconds: 45
  cache_hours: 6
  on_failure: cautela       # cautela | fail_closed
  unlock_lookahead_days: 14

risk:
  risk_per_trade_pct: 1.0
  neutral_regime_risk_factor: 0.5
  caution_risk_factor: 0.5
  max_open_positions: 4
  max_open_positions_neutral: 2
  max_exposure_per_coin_pct: 25
  max_total_exposure_pct: 80
  max_positions_per_sector: 2
  daily_loss_limit_pct: 3
  max_consecutive_losses: 3
  consecutive_losses_pause_hours: 24
  weekly_drawdown_limit_pct: 6
  max_drawdown_from_peak_pct: 15
  min_order_notional_usdt: 5      # abaixo disso a ordem não é feita (mínimo típico da Bybit spot)
  sectors: {}                     # moeda base -> setor (ex.: {SOL: L1, ARB: L2}); vazio = limite por setor desligado

exits:
  tp1_r: 1.5
  tp1_close_fraction: 0.5
  move_stop_to_breakeven_after_tp1: true
  mode_after_tp1: trailing   # trailing | fixed_tp2
  tp2_r: 3.0
  trailing_lookback_candles_1h: 3
  trailing_atr_buffer: 0.5
  time_stop_hours: 48
  time_stop_min_r: 0.5
  invalidation_close_below_ema50_4h: true

costs:
  fee_rate_per_side: 0.001
  backtest_slippage_pct: 0.05

backtest:                         # python -m bot.tools.run_backtest
  initial_equity_usdt: 1000
  warmup_days: 60                 # início da simulação depois do aquecimento dos indicadores
  candles:                        # mesmas janelas do robô ao vivo para BTC/regime e setups
    h1: 300
    h4: 500
    d1_btc: 600
  walk_forward:
    train_months: 6               # sem otimização automática: o "treino" só marca o início das janelas
    test_months: 2
    step_months: 2
  gate:                           # critérios do Gate 5 (02_PLANO_DE_EXECUCAO.md)
    min_trades: 150
    min_profit_factor: 1.3
    min_expectancy_r: 0.15
    max_drawdown_pct: 20
    max_single_trade_profit_share_pct: 25

dashboard:
  enabled: true
  ingest_url: "https://bybit-trader-view.lovable.app/api/public/bot-ingest"   # token via Secret Manager: BOT_INGEST_TOKEN
  timeout_seconds: 15
  max_retries: 3                  # 5xx, 503 e rede; 400/401 não repetem
  max_results_per_run: 150        # linhas do ranking enviadas por varredura

telegram:
  enabled: true   # TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID via Secret Manager

# ---------------------------------------------------------------------------
# onchain — dados on-chain da Hyperliquid via Coinversa (OPCIONAL)
# Hyperliquid NÃO é Bybit: são perpétuos da HL, usados só como proxy de
# posicionamento e alavancagem. As regras só REDUZEM risco; dado ausente,
# vencido ou abaixo do gate de qualidade = neutro (o robô segue igual à
# estratégia base). A chave vem do Secret Manager, nunca deste arquivo.
# ---------------------------------------------------------------------------
onchain:
  enabled: true                  # false = NullProvider (resultado idêntico à estratégia base)
  provider: coinversa            # coinversa (REST ao vivo) | replay (snapshots gravados, backtest/paper) | null
  mode: shadow                   # shadow = calcula e GRAVA, sem efeito na decisão | active = aplica rules_active
  rules_active: []               # só vale com mode: active; ativar UMA por vez após validação: S1, F2, F3, R2, R3

  # --- acesso à API (confirmar tudo em docs.coinversa.ai antes de codar) ---
  base_url: "https://api.coinversa.ai/api/public/v1"
  api_key_secret: COINVERSA_API_KEY   # nome do segredo no Secret Manager (formato cvsa_...)
  auth_header: X-API-Key              # visto só no código do cliente oficial; confirmar na doc
  http:
    timeout_seconds: 4           # por chamada
    scan_budget_seconds: 20      # teto de tempo on-chain por varredura horária
    trigger_budget_seconds: 6    # teto de tempo on-chain por ciclo de gatilho (15 min)
    max_retries: 0               # sem retry dentro do ciclo (o burst por chave é pequeno)
    min_interval_ms: 250         # chamadas sequenciais e espaçadas
    circuit_breaker:
      failures_to_open: 3        # 3 falhas seguidas -> circuito aberto (NullProvider)
      open_minutes: 15           # depois tenta 1 chamada de teste (half-open)
    on_auth_error_disable_hours: 24   # 401/403: desliga on-chain, alerta, robô continua
    respect_retry_after: true    # 429: respeita retryAfterSeconds e pula a moeda

  # --- orçamento (abaixo do plano Free para sobreviver ao fim de um trial Pro) ---
  budget:
    max_calls_per_day: 800
    max_calls_per_hour: 40
    reserve_for_triggers_per_day: 150
    priority: [risk_overview, market_overview, btc_cohort, candidate_cohort, candidate_risk, trigger_liq_summary, trigger_heatmap_log]

  # --- cache e frescor ---
  cache_ttl_minutes:
    cohort_history: 90
    risk_snapshot: 60
    risk_overview: 120
    market_overview: 60
    liquidation_summary_1h: 15
    heatmap: 15
  max_data_age_minutes: 120      # asOf/generatedAt mais velho que isso = ausente (nunca usar dado vencido)
  history_lag_hours: 1           # snapshot horário da hora h só vale a partir de h+1h (sem look-ahead)

  # --- gravação própria (SEMPRE ligada, inclusive em shadow) ---
  snapshot_log:
    enabled: true                # heatmap, near-liq e alavancagem não têm histórico na API;
    uri: "gs://<bucket>/onchain/"  # o histórico de coorte parece ser janela móvel de ~90 dias
    async_write: true            # grava DEPOIS da decisão; nunca no caminho da ordem
    export_cohort_history_on_start: true   # exporta o histórico disponível
    local_db_path: data/onchain.db         # cópia local (SQLite) do histórico de coortes
    export_since: 90d                      # formato relativo da API (ms e ISO são recusados); 90d cabe numa chamada
    refresh_since: 3d                      # atualização diária (cron): 3 dias com sobreposição; a API guarda 90d
    export_timeout_seconds: 60             # a resposta de 90 dias tem ~68 mil linhas por moeda
    export_min_interval_ms: 1300           # ~45 chamadas/min (limite por rota visto: 50/min)

  # --- mapeamento par Bybit spot -> coin da Hyperliquid ---
  symbol_map:
    auto_native: true            # BASE do par Bybit = coin nativo da HL (sem prefixo)
    overrides:                   # prefixo k = 1000 unidades: preços da HL ÷ mult
      PEPE: {hl: kPEPE, mult: 1000}
      SHIB: {hl: kSHIB, mult: 1000}
      BONK: {hl: kBONK, mult: 1000}
      FLOKI: {hl: kFLOKI, mult: 1000}
      LUNC: {hl: kLUNC, mult: 1000}
    native_dex: hl               # campo "dex" dos perps nativos na market-overview (xyz, hyna, km... = builder dexes)
    exclude_hl_patterns: [":", "#", "@"]   # builder dexes (ações/FX), HIP-4, spot interno HL
    price_check_max_dev_pct: 2.0 # (markPx HL ÷ mult) vs lastPrice Bybit; fora disso = ausente
    deny: []                     # colisões de ticker confirmadas (mesmo símbolo, ativo diferente)

  # --- gates de qualidade/materialidade (falhou = ausente = neutro) ---
  quality:
    min_hl_oi_usd: 20000000      # OI da moeda na HL (market.totalOi)
    smart_min_accounts: 50       # Apex + Sharps somados (accountCount)
    smart_min_notional_usd: 20000000   # Apex + Sharps, long + short
    crowd_min_accounts: 300      # The Crowd (accountCount)
    crowd_min_notional_usd: 5000000
    empty_tiers_is_missing: true # HTTP 200 com tiers [] = ausente, nunca "bias 0"

  # --- S1 (+ S5): divergência smart money x multidão, SÓ PENALIDADE ---
  score:
    smart_tiers: [money_printer, smart_money]  # Apex + Sharps, somados por notional, SEM peso
    crowd_tiers: [exit_liquidity]              # The Crowd
    bias_from_notionals: true    # recalcular (L-S)/(L+S); netBias vem em % numa rota e fração em outra
    sm_short_max: -0.25          # SM_pool <= -0,25
    crowd_hot_min: 0.35          # e CROWD >= +0,35
    persistence_hours: 4         # nas últimas 4 h fechadas...
    persistence_min_hits: 3      # ...em pelo menos 3
    penalty_points: -3
    min_adj: -3
    max_adj: 0                   # nunca bônus
    can_promote: false           # em active só rebaixa (A->B, B->descartada)

  # --- filtros de entrada ---
  filter:
    near_liq:                    # F2: veto exige AS DUAS condições
      share_veto_pct: 15         # nearLiquidationNotional / market.totalOi >= 15 %
      avg_liq_distance_max_pct: 5      # e avgLiquidationDistancePct <= 5 %
      percentile_after_days: 30  # com >= 30 d de log: limiar = max(15 %, p99 da própria moeda)
      percentile: 99
    cascade:                     # F3: cascata de liquidação long em andamento
      window: 1h
      long_liq_pct_of_oi: 1.0    # longNotional(1h) >= 1,0 % do OI da moeda na HL
      min_long_events: 20        # e >= 20 eventos long
      pause_hours: 2             # sem nova entrada nessa moeda

  # --- risco (fatores só <= 1,0; max_positions NÃO muda) ---
  risk:
    market_near_liq:             # R2: fragilidade do mercado HL inteiro
      share_warn_pct: 8          # nearLiquidationNotional / totalOI (overview) >= 8 %
      factor: 0.75
      percentile_after_days: 30  # com >= 30 d de log: limiar = max(8 %, p95 do log)
      percentile: 95
    btc_inverse_divergence:      # R3: S1 aplicado ao BTC (mesmos limiares e gates de score.*)
      factor: 0.75
    combine: min                 # R4: fator_onchain = min(R2, R3)
    min_onchain_factor: 0.75
    min_total_risk_factor: 0.25  # produto dos fatores < 0,25 => NÃO entra (não é piso que aumenta risco)
    on_unavailable_factor: 1.0   # ausência nunca reduz nem bloqueia

  # --- regras derrubadas: só gravadas para estudo (sem efeito) ---
  shadow_only:
    log_heatmap_on_trigger: true # F1/ST1: contrafactual do stop abaixo do cluster
    heatmap_range_pct: 10
    heatmap_buckets: 30
    log_sm_delta_24h: true       # S2
    log_crowd_bias: true         # S3
    log_coin_leverage: true      # S4 / R1

  gemini:
    include_in_prompt: false     # G1 derrubada: evita contagem dupla e mantém o veto do Gemini mensurável
    show_in_dashboard: true      # bloco on-chain com asOf só no painel/Telegram

  alerts:
    telegram_max_per_hour: 1     # circuito aberto / recuperação / erro de autenticação
